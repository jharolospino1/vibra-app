name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permiso a gradlew
        run: chmod +x gradlew || true

      - name: Generar gradlew si falta
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK (solo para ti, requiere cuenta de GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: vibra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar como Release público (enlace directo para cualquiera)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Vibra (última versión)
          body: APK generado automáticamente desde el código. Instálalo permitiendo "orígenes desconocidos".
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
